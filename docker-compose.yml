services:
  marzban:
    image: npvpn/panel:latest
    restart: always
    env_file: .env
    network_mode: host
    volumes:
      - /var/lib/marzban:/var/lib/marzban
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no
